<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}VisaSlot Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #071018;
      --ink-2: #0d1824;
      --card: rgba(18, 30, 44, 0.92);
      --card-solid: #121e2c;
      --line: rgba(244, 240, 232, 0.11);
      --line-strong: rgba(230, 197, 122, 0.35);
      --text: #f4f0e8;
      --muted: rgba(244, 240, 232, 0.64);
      --gold: #c9a85c;
      --gold-2: #e6c57a;
      --ok: #4ad39a;
      --warn: #e8b84a;
      --danger: #ff8f8f;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Manrope", system-ui, sans-serif;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1000px 520px at 12% -12%, rgba(201,168,92,.2), transparent 58%),
        radial-gradient(800px 480px at 100% 0%, rgba(48, 98, 150, .16), transparent 52%),
        linear-gradient(180deg, #09131d 0%, var(--ink) 40%, #0a1520 100%);
      line-height: 1.5;
    }
    a { color: var(--gold-2); text-decoration: none; }
    a:hover { color: #fff; }
    .top {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: .85rem clamp(1rem, 3vw, 1.75rem);
      border-bottom: 1px solid var(--line);
      background: rgba(7,16,24,.82);
      backdrop-filter: blur(14px);
    }
    .brand {
      display: flex; align-items: baseline; gap: .5rem;
      font-family: var(--serif);
      font-size: 1.55rem;
    }
    .brand em { font-style: normal; color: var(--gold-2); }
    .brand small {
      font-family: var(--sans);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: .15rem;
    }
    .top-nav {
      display: flex; gap: .9rem; align-items: center;
      font-size: .88rem; color: var(--muted); font-weight: 500;
    }
    .top-nav .who {
      padding: .28rem .6rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-size: .78rem;
    }
    main { max-width: 1140px; margin: 0 auto; padding: 1.6rem clamp(1rem, 3vw, 1.5rem) 3.5rem; }
    .hero-line {
      font-family: var(--serif);
      font-size: clamp(1.75rem, 3.2vw, 2.35rem);
      margin: 0 0 .4rem;
      font-weight: 400;
      letter-spacing: -.01em;
    }
    .lede { color: var(--muted); margin: 0 0 1.35rem; max-width: 38rem; font-size: .98rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .8rem;
      margin-bottom: 1.35rem;
    }
    @media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.05rem;
      box-shadow: var(--shadow);
    }
    .stat b {
      display: block;
      font-size: 1.7rem;
      font-family: var(--serif);
      font-weight: 400;
      line-height: 1.1;
    }
    .stat span { color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: .65rem; align-items: center;
      margin-bottom: 1.1rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip-filter {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--muted);
      border-radius: 999px;
      padding: .38rem .8rem;
      font: inherit;
      font-size: .8rem;
      font-weight: 650;
      text-decoration: none;
      transition: .15s ease;
    }
    .chip-filter.active, .chip-filter:hover {
      border-color: var(--line-strong);
      color: var(--gold-2);
      background: rgba(201,168,92,.1);
    }
    input[type=search], input[type=text], input[type=email], input[type=number], textarea, select {
      background: rgba(7, 14, 22, .75);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: .65rem .8rem;
      font: inherit;
      width: 100%;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus {
      border-color: rgba(230,197,122,.65);
      box-shadow: 0 0 0 3px rgba(201,168,92,.16);
    }
    input[type=search] { width: min(300px, 100%); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
      border: 0; border-radius: 12px;
      padding: .62rem 1.05rem;
      font: inherit; font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: #1a1408;
      text-decoration: none;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.05); transform: translateY(-1px); color: #1a1408; }
    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }
    .btn.ghost:hover { border-color: var(--gold); color: var(--gold-2); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.2rem 1.2rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }
    .card h2, .card h3 {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0 0 .8rem;
      font-size: 1.45rem;
    }
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: .9rem;
    }
    .user-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.05rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: .7rem;
      box-shadow: var(--shadow);
      transition: border-color .18s ease, transform .18s ease;
    }
    .user-card:hover {
      border-color: rgba(230,197,122,.42);
      transform: translateY(-2px);
    }
    .user-card h3 {
      font-family: var(--serif);
      font-size: 1.35rem;
      margin: 0;
      font-weight: 400;
    }
    .meta { color: var(--muted); font-size: .84rem; }
    .pill {
      display: inline-flex; align-items: center;
      border-radius: 999px;
      padding: .2rem .58rem;
      font-size: .7rem;
      font-weight: 750;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .pill.on { background: rgba(74,211,154,.14); color: var(--ok); }
    .pill.off { background: rgba(232,184,74,.12); color: var(--warn); }
    .city-tags { display: flex; flex-wrap: wrap; gap: .35rem; min-height: 1.6rem; }
    .tag {
      background: rgba(244,240,232,.05);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .22rem .58rem;
      font-size: .78rem;
    }
    .row-actions { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li {
      background: rgba(74,211,154,.1);
      border: 1px solid rgba(74,211,154,.32);
      color: var(--ok);
      padding: .75rem .95rem;
      border-radius: 14px;
      margin-bottom: .4rem;
      font-weight: 560;
    }
    .section-label {
      font-size: .74rem;
      font-weight: 750;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin: .95rem 0 .4rem;
    }
    .field-hint { color: var(--muted); font-size: .8rem; margin: .35rem 0 0; }
    .switch {
      display: flex; align-items: center; gap: .7rem;
      padding: .85rem .9rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(7,14,22,.55);
    }
    .switch input { width: auto; accent-color: var(--gold); transform: scale(1.2); }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .55rem;
    }
    @media (max-width: 720px) { .preset-grid { grid-template-columns: 1fr 1fr; } }
    .preset {
      border: 1px solid var(--line);
      background: rgba(7,14,22,.55);
      border-radius: 14px;
      padding: .75rem .65rem;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: .15s ease;
    }
    .preset strong { display: block; font-size: .95rem; }
    .preset span { display: block; color: var(--muted); font-size: .74rem; margin-top: .2rem; }
    .preset.active {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 1px rgba(201,168,92,.28);
      background: rgba(201,168,92,.1);
    }
    .chip-box {
      display: flex; flex-wrap: wrap; gap: .4rem;
      min-height: 3.1rem;
      padding: .7rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(7,14,22,.55);
    }
    .city-chip {
      display: inline-flex; align-items: center; gap: .35rem;
      background: rgba(201,168,92,.12);
      border: 1px solid rgba(201,168,92,.38);
      color: var(--gold-2);
      border-radius: 999px;
      padding: .32rem .55rem .32rem .72rem;
      font-size: .82rem;
      font-weight: 650;
    }
    .city-chip button {
      border: 0; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 .15rem;
    }
    .city-chip button:hover { color: var(--danger); }
    .suggest { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
    .suggest button {
      border: 1px dashed var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: .3rem .65rem;
      font: inherit;
      font-size: .78rem;
      cursor: pointer;
    }
    .suggest button:hover {
      border-color: var(--gold);
      color: var(--gold-2);
    }
    .add-row { display: grid; grid-template-columns: 1fr 1.2fr auto; gap: .5rem; margin-top: .65rem; }
    @media (max-width: 720px) { .add-row { grid-template-columns: 1fr; } }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
    @media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: left; padding: .58rem .4rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 650; }
    .empty {
      text-align: center;
      padding: 2.8rem 1.2rem;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(18,30,44,.4);
    }
    .empty strong {
      display: block; color: var(--text);
      font-family: var(--serif); font-size: 1.45rem;
      margin-bottom: .4rem; font-weight: 400;
    }
    details.advanced { margin-top: .8rem; color: var(--muted); font-size: .85rem; }
    details.advanced summary { cursor: pointer; color: var(--gold-2); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="{% url 'panel_home' %}">Visa<em>Slot</em> <small>Admin</small></a>
    <nav class="top-nav">
      <a href="{% url 'panel_home' %}">Users</a>
      {% if operator %}<span class="who">{{ operator }}</span>{% endif %}
      <a href="{% url 'panel_logout' %}">Sign out</a>
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
