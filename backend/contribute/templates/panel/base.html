<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}VisaBook Ops{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e26;
      --panel2: #1c2530;
      --line: #2a3542;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #2dd4bf;
      --accent2: #38bdf8;
      --warn: #fbbf24;
      --bad: #f87171;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(1000px 500px at 10% -10%, rgba(45, 212, 191, 0.12), transparent 55%),
        radial-gradient(800px 400px at 100% 0%, rgba(56, 189, 248, 0.10), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } .nav { position: sticky; top: 0; z-index: 5; } }
    .nav {
      background: rgba(23, 30, 38, 0.95);
      border-right: 1px solid var(--line);
      padding: 1.25rem 1rem;
    }
    .brand { font-weight: 700; letter-spacing: 0.02em; margin-bottom: 1.25rem; }
    .brand span { color: var(--accent); }
    .nav a {
      display: block;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      color: var(--muted);
      margin-bottom: 0.25rem;
      text-decoration: none;
    }
    .nav a.active, .nav a:hover {
      background: var(--panel2);
      color: var(--text);
      text-decoration: none;
    }
    .main { padding: 1.25rem 1.5rem 2.5rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.92rem; }
    .grid { display: grid; gap: 0.85rem; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
    }
    .card .k { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .v { font-size: 1.55rem; font-weight: 700; margin-top: 0.25rem; font-family: "IBM Plex Mono", monospace; }
    .section { margin-top: 1.25rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.55rem 0.45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: "IBM Plex Mono", monospace;
    }
    .badge.ok { background: rgba(52, 211, 153, 0.15); color: var(--ok); }
    .badge.empty { background: rgba(139, 154, 171, 0.15); color: var(--muted); }
    .badge.err { background: rgba(248, 113, 113, 0.15); color: var(--bad); }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: 0.84rem; }
    .muted { color: var(--muted); }
    form.filters { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; align-items: end; }
    label { display: grid; gap: 0.25rem; font-size: 0.8rem; color: var(--muted); }
    input, select, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      padding: 0.5rem 0.65rem;
    }
    button, .btn {
      background: linear-gradient(180deg, #2dd4bf, #14b8a6);
      color: #042f2e;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li { padding: 0.65rem 0.8rem; border-radius: 8px; margin-bottom: 0.4rem; }
    .messages .ok { background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.35); }
    .messages .err { background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.35); }
    .form-grid { display: grid; gap: 0.85rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 800px) { .form-grid { grid-template-columns: 1fr; } }
    .win-head {
      display: grid;
      grid-template-columns: 70px 1fr 1fr 88px;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .win-row { display: grid; grid-template-columns: 70px 1fr 1fr 88px; gap: 0.5rem; align-items: end; }
    .win-row label { margin: 0; }
    .win-row input { width: 100%; }
    button.danger, .btn.danger {
      background: rgba(248, 113, 113, 0.16);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.45);
      font-weight: 600;
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button.danger:hover, .btn.danger:hover { background: rgba(248, 113, 113, 0.28); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .login-wrap {
      min-height: 100vh; display: grid; place-items: center; padding: 1rem;
    }
    .login-card { width: min(380px, 100%); }
  </style>
</head>
<body>
{% if section %}
<div class="shell">
  <aside class="nav">
    <div class="brand">VisaBook <span>Ops</span></div>
    <a href="{% url 'panel_home' %}" class="{% if section == 'home' %}active{% endif %}">Overview</a>
    <a href="{% url 'panel_history' %}" class="{% if section == 'history' %}active{% endif %}">City history</a>
    <a href="{% url 'panel_users' %}" class="{% if section == 'users' %}active{% endif %}">Users</a>
    <a href="{% url 'panel_timings' %}" class="{% if section == 'timings' %}active{% endif %}">Timings</a>
    <a href="/admin/" target="_blank" rel="noopener">Django admin</a>
    <a href="{% url 'panel_logout' %}">Log out</a>
  </aside>
  <main class="main">
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{% if 'error' in message.tags %}err{% else %}ok{% endif %}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
  {% block bare %}{% endblock %}
{% endif %}
</body>
</html>
