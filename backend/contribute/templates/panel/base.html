<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}VisaSlot Admin{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1624;
      --ink-2: #132033;
      --card: #162536;
      --line: rgba(243, 239, 230, 0.12);
      --text: #f3efe6;
      --muted: rgba(243, 239, 230, 0.68);
      --gold: #c4a35a;
      --gold-bright: #e0c07a;
      --ok: #3ecf8e;
      --warn: #e8b84a;
      --danger: #e57373;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Manrope", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(196,163,90,.16), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(61,120,200,.12), transparent 50%),
        var(--ink);
      line-height: 1.5;
    }
    a { color: var(--gold-bright); text-decoration: none; }
    a:hover { color: #fff; }
    .top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: .9rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(12,22,36,.88);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex; align-items: baseline; gap: .55rem;
      font-family: var(--serif);
      font-size: 1.55rem;
      letter-spacing: .01em;
    }
    .brand span { color: var(--gold-bright); }
    .brand small {
      font-family: var(--sans);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .top-nav { display: flex; gap: 1rem; align-items: center; font-size: .9rem; color: var(--muted); }
    main { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .hero-line {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      margin: 0 0 .35rem;
      font-weight: 400;
    }
    .lede { color: var(--muted); margin: 0 0 1.25rem; max-width: 40rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .9rem 1rem;
    }
    .stat b { display: block; font-size: 1.45rem; font-family: var(--serif); }
    .stat span { color: var(--muted); font-size: .82rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: .65rem; align-items: center;
      margin-bottom: 1rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip-filter {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: .35rem .75rem;
      font: inherit;
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
    }
    .chip-filter.active, .chip-filter:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
      background: rgba(196,163,90,.1);
    }
    input[type=search], input[type=text], input[type=email], input[type=number], textarea, select {
      background: #0d1826;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: .6rem .75rem;
      font: inherit;
      width: 100%;
    }
    input[type=search] { width: min(280px, 100%); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
      border: 0; border-radius: 10px;
      padding: .6rem 1rem;
      font: inherit; font-weight: 650;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-bright), var(--gold));
      color: #1a1408;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.05); color: #1a1408; }
    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
    }
    .btn.ghost:hover { border-color: var(--gold); color: var(--gold-bright); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem 1.15rem;
      margin-bottom: 1rem;
    }
    .card h2, .card h3 {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0 0 .75rem;
    }
    .grid {
      display: grid;
      gap: .85rem;
    }
    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: .85rem;
    }
    .user-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.05rem;
      display: flex;
      flex-direction: column;
      gap: .65rem;
      transition: border-color .15s ease, transform .15s ease;
    }
    .user-card:hover { border-color: rgba(224,192,122,.45); transform: translateY(-1px); }
    .user-card h3 {
      font-family: var(--serif);
      font-size: 1.25rem;
      margin: 0;
      font-weight: 400;
    }
    .meta { color: var(--muted); font-size: .84rem; }
    .pill {
      display: inline-flex; align-items: center;
      border-radius: 999px;
      padding: .18rem .55rem;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .pill.on { background: rgba(62,207,142,.15); color: var(--ok); }
    .pill.off { background: rgba(232,184,74,.12); color: var(--warn); }
    .city-tags { display: flex; flex-wrap: wrap; gap: .35rem; min-height: 1.6rem; }
    .tag {
      background: rgba(243,239,230,.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .2rem .55rem;
      font-size: .78rem;
    }
    .row-actions { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li {
      background: rgba(62,207,142,.12);
      border: 1px solid rgba(62,207,142,.35);
      color: var(--ok);
      padding: .7rem .9rem;
      border-radius: 12px;
      margin-bottom: .4rem;
      font-weight: 500;
    }
    .section-label {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1rem 0 .45rem;
    }
    .field-hint { color: var(--muted); font-size: .8rem; margin: .3rem 0 0; }
    .switch {
      display: flex; align-items: center; gap: .65rem;
      padding: .75rem .85rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1826;
    }
    .switch input { width: auto; accent-color: var(--gold); transform: scale(1.15); }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5rem;
    }
    @media (max-width: 700px) { .preset-grid { grid-template-columns: 1fr 1fr; } }
    .preset {
      border: 1px solid var(--line);
      background: #0d1826;
      border-radius: 12px;
      padding: .7rem .6rem;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }
    .preset strong { display: block; font-size: .95rem; }
    .preset span { display: block; color: var(--muted); font-size: .75rem; margin-top: .15rem; }
    .preset.active {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(196,163,90,.35);
      background: rgba(196,163,90,.08);
    }
    .chip-box {
      display: flex; flex-wrap: wrap; gap: .4rem;
      min-height: 3rem;
      padding: .65rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1826;
    }
    .city-chip {
      display: inline-flex; align-items: center; gap: .35rem;
      background: rgba(196,163,90,.12);
      border: 1px solid rgba(196,163,90,.35);
      color: var(--gold-bright);
      border-radius: 999px;
      padding: .3rem .55rem .3rem .7rem;
      font-size: .82rem;
      font-weight: 600;
    }
    .city-chip button {
      border: 0; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 .15rem;
    }
    .city-chip button:hover { color: var(--danger); }
    .suggest {
      display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem;
    }
    .suggest button {
      border: 1px dashed var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: .28rem .6rem;
      font: inherit;
      font-size: .78rem;
      cursor: pointer;
    }
    .suggest button:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
    }
    .add-row { display: grid; grid-template-columns: 1fr 1.2fr auto; gap: .45rem; margin-top: .65rem; }
    @media (max-width: 700px) { .add-row { grid-template-columns: 1fr; } }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    @media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: left; padding: .55rem .4rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
    }
    .empty strong { display: block; color: var(--text); font-family: var(--serif); font-size: 1.35rem; margin-bottom: .35rem; }
    details.advanced { margin-top: .75rem; color: var(--muted); font-size: .85rem; }
    details.advanced summary { cursor: pointer; color: var(--gold-bright); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <div class="brand">Visa<span>Slot</span> <small>Admin</small></div>
    <nav class="top-nav">
      <a href="{% url 'panel_home' %}">Users</a>
      <a href="/admin/">Advanced</a>
      <a href="/admin/logout/">Sign out</a>
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
