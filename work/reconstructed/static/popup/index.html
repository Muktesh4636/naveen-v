<!doctype html>
<html lang="en">
  <head>
    <title>VisaSlots.info</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="popup-container">
      <header>
        <h3 id="title">VisaSlots.info</h3>
      </header>

      <section class="status-card">
        <div class="status-section">
          <div class="status-section-header">Account</div>
          <div class="status-row">
            <span class="status-label">Email</span>
            <span class="status-value" id="status-email">Unknown</span>
          </div>
        </div>
        <div class="status-section">
          <div class="status-section-header">Contributions</div>
          <div class="status-row">
            <span class="status-label">Last 24 Hours</span>
            <span class="status-value" id="status-contribs">0</span>
          </div>
          <div class="status-row">
            <span class="status-label">Latest</span>
            <span class="status-value" id="status-updated">Unknown</span>
          </div>
        </div>
      </section>

      <h3 id="settings-header">Settings</h3>

      <section class="settings-card">
        <div class="settings-group">
          <div class="settings-group-header">Scheduling Page</div>
          
          <div class="setting-row">
            <span class="setting-label">Wait Time</span>
            <select class="setting-select" id="defaultWaitTime" aria-label="Wait time">
              <option value="0">Off</option>
              <option value="5">5s</option>
              <option value="10">10s</option>
              <option value="15">15s</option>
              <option value="30">30s</option>
              <option value="45">45s</option>
              <option value="60">60s</option>
              <option value="120">2m</option>
              <option value="180">3m</option>
              <option value="240">4m</option>
              <option value="300">5m</option>
            </select>
          </div>

          <div class="setting-row">
            <span class="setting-label">Recheck Button</span>
            <label class="switch">
              <input type="checkbox" id="recheckButton" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="setting-row">
            <span class="setting-label">Audio Alerts</span>
            <label class="switch">
              <input type="checkbox" id="audioAlert" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="setting-row">
            <span class="setting-label">Auto Select First Date</span>
            <label class="switch">
              <input type="checkbox" id="autoSelectFirstDate" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-group-header">Login</div>

          <div class="setting-row autofill-row">
            <div class="setting-text">
              <span class="setting-label">Autofill Security Questions</span>
              <span class="autofill-note">Passwords never leave your device</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="autofill" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <footer>
        <a
          id="version"
          href="https://chromewebstore.google.com/detail/visaslotsinfo/oabehjadicgppcgikbggaoggnnhclhkp"
          target="_blank"
          rel="noopener"
        ></a>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
